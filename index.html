<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương trình quay số Rung Chuông Vàng</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }
        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .logo-box {
            width: 75px;
            height: 75px;
            border: none;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #ffffff;
            position: relative;
        }
        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .logo-box img[src="logo3.jpg"] {
            background: #ffffff;
            padding: 8px;
            object-fit: contain;
            transform: scale(1.32);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p.subtitle {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .display-box {
            background: #f8f9fa;
            border: 3px dashed #3498db;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .cell-label {
            font-size: 14px;
            color: #e74c3c;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .numbers-result {
            font-size: 22px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 1px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        .btn-spin {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
            transition: transform 0.1s;
        }
        .btn-spin:active {
            transform: scale(0.95);
        }
        .btn-spin:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-history {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .btn-reset {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }

        .toast-banner {
            background: #eef2f7;
            border: 2px dashed #2ecc71;
            padding: 12px 20px;
            border-radius: 12px;
            margin: 15px auto;
            max-width: 500px;
            animation: fadeInDown 0.3s ease-in-out;
            display: none;
            text-align: left;
        }
        .toast-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2c3e50;
            font-size: 15px;
        }
        .toast-content b {
            color: #e74c3c;
        }
        .toast-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
        }
        .toast-close-btn:hover {
            color: #e74c3c;
        }

        /* Nhóm nút điều khiển góc phải trên (Toàn màn hình & Nhạc nền) */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .top-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .top-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: left;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }
        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid #f1f2f6;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Khối nút bấm ở góc phải phía trên màn hình -->
    <div class="top-controls">
        <button id="musicToggleBtn" onclick="toggleBgMusic()" class="top-btn" title="Bật/Tắt nhạc nền">
            🔇
        </button>
        <button onclick="toggleFullScreen()" class="top-btn" title="Phóng to toàn màn hình">
            ⛶ Toàn màn hình
        </button>
    </div>

    <!-- 2 Thẻ audio -->
    <audio id="bgMusic" src="nhacnen.mp3" preload="auto" loop></audio>
    <audio id="spinAudio" src="nhacquay.mp3" preload="auto" controls style="display:none;"></audio>

    <div class="container">
        <div class="logos-container">
            <div class="logo-box">
                <img src="logo1.jpg" alt="Logo 1" onerror="this.style.display='none'">
            </div>
            <div class="logo-box">
                <img src="logo2.jpg" alt="Logo 2" onerror="this.style.display='none'">
            </div>
            <div class="logo-box">
                <img src="logo3.jpg" alt="Logo 3" onerror="this.style.display='none'">
            </div>
        </div>

        <h1>Truy Tìm 15 Chiến Binh Rung Chuông Vàng</h1>
        <p class="subtitle">Vòng quay định mệnh – Lộ diện 15 gương mặt may mắn nhất</p>

        <div id="toastMessage" class="toast-banner">
            <div class="toast-content">
                <span>🎉 <b>Kết quả:</b> <span id="toastNumbers">00, 00, 00, 00, 00</span></span>
                <button onclick="closeToast()" class="toast-close-btn">&times;</button>
            </div>
        </div>

        <div class="display-box" id="displayBox">
            <div class="cell-label" id="cellLabel">ready</div>
            <div class="numbers-result" id="numberResult">Let's go!</div>
        </div>

        <div class="button-group">
            <button class="btn-spin" id="spinBtn" onclick="startSpinning()">Bắt đầu quay</button>
            <button class="btn-history" onclick="openHistoryModal()">Xem Lịch Sử</button>
            <button class="btn-reset" onclick="resetGame()">Làm mới (Reset)</button>
        </div>
    </div>

    <div class="modal" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Lịch Sử Đã Quay</h2>
                <button class="close-btn" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div id="fullHistoryList">Chưa có lượt quay nào.</div>
        </div>
    </div>

    <script>
        // Hàm Bật/Tắt nhạc nền thủ công qua nút bấm ở góc trên
        function toggleBgMusic() {
            const bgMusic = document.getElementById('bgMusic');
            const musicBtn = document.getElementById('musicToggleBtn');

            if (bgMusic.paused) {
                bgMusic.volume = 0.4;
                bgMusic.play().then(() => {
                    musicBtn.innerText = "🔊";
                }).catch(e => {
                    alert("Không thể phát file nhạc nền. Bạn hãy kiểm tra lại file 'nhacnen.mp3' có nằm chung thư mục không nhé!");
                });
            } else {
                bgMusic.pause();
                musicBtn.innerText = "🔇";
            }
        }

        const originalCells = [
            "145, 12, 384, 95, 230", "67, 211, 342, 3, 188", "255, 48, 112, 399, 74", "18, 301, 133, 264, 89",
            "315, 150, 41, 222, 59", "102, 360, 27, 175, 288", "333, 8, 194, 120, 246", "77, 305, 161, 29, 370",
            "235, 114, 52, 348, 180", "15, 272, 390, 91, 205", "320, 64, 137, 250, 2", "190, 31, 280, 110, 354",
            "84, 219, 365, 45, 168", "295, 13, 228, 98, 330", "380, 56, 172, 241, 105", "23, 311, 142, 275, 70",
            "118, 350, 5, 185, 292", "362, 80, 215, 38, 325", "200, 155, 62, 268, 127", "40, 338, 94, 283, 170",
            "312, 11, 248, 79, 192", "165, 375, 54, 220, 130", "285, 88, 3, 303, 210", "35, 125, 262, 392, 178",
            "225, 90, 140, 340, 65", "100, 318, 20, 258, 182", "352, 50, 174, 290, 82", "148, 270, 75, 368, 15",
            "240, 85, 322, 116, 202", "308, 33, 160, 232, 385", "60, 198, 345, 122, 278", "183, 395, 25, 96, 316",
            "328, 10, 212, 152, 260", "72, 252, 378, 135, 44", "208, 364, 99, 30, 298", "115, 335, 55, 186, 245",
            "294, 62, 162, 382, 18", "372, 138, 274, 86, 224", "49, 196, 310, 108, 265", "158, 358, 25, 324, 76",
            "226, 81, 390, 144, 203", "92, 314, 17, 282, 132", "346, 58, 238, 101, 276", "128, 284, 4, 355, 189",
            "218, 396, 70, 150, 326", "68, 256, 306, 124, 38", "302, 111, 195, 341, 87", "164, 43, 229, 317, 204",
            "290, 123, 51, 376, 141", "36, 244, 173, 93, 332", "191, 356, 21, 106, 267", "117, 279, 398, 71, 236",
            "266, 78, 149, 321, 154", "388, 151, 64, 214, 296", "46, 184, 311, 103, 361", "233, 104, 349, 29, 199",
            "134, 323, 83, 254, 379", "304, 53, 176, 221, 113", "206, 369, 14, 97, 287", "73, 242, 394, 169, 32",
            "344, 126, 47, 281, 216", "156, 339, 107, 237, 80", "273, 90, 193, 353, 39", "121, 313, 61, 225, 389",
            "259, 16, 299, 119, 347", "375, 84, 207, 57, 187", "109, 331, 234, 147, 269", "22, 286, 42, 391, 163",
            "351, 136, 74, 239, 300", "179, 297, 69, 112, 381", "247, 55, 159, 327, 94", "88, 319, 217, 139, 263",
            "336, 20, 181, 277, 48", "167, 366, 105, 227, 78", "291, 129, 37, 343, 213", "66, 251, 397, 153, 307",
            "143, 377, 82, 201, 125", "309, 45, 231, 100, 363", "197, 329, 11, 289, 71", "385, 177, 63, 253, 157"
        ];

        let cells = [...originalCells];
        let fullHistory = [];

        function startSpinning() {
            if (cells.length === 0) {
                alert("Đã quay hết tất cả các nhóm! Vui lòng bấm nút 'Làm mới (Reset)'.");
                return;
            }

            // Phát nhạc quay số
            const sound = document.getElementById('spinAudio');
            if (sound) {
                sound.currentTime = 0; 
                sound.play().catch(e => console.log("Lỗi phát nhạc quay:", e));
            }

            const btn = document.getElementById('spinBtn');
            const resultEl = document.getElementById('numberResult');
            const labelEl = document.getElementById('cellLabel');
            const boxEl = document.getElementById('displayBox');
            
            btn.disabled = true;
            boxEl.style.borderColor = '#e74c3c';
            
            let counter = 0;
const totalSteps = 25;
const totalDuration = 4000; // Cố định đúng 4 giây (4000ms)
const startTime = Date.now(); // Ghi nhận thời điểm bắt đầu bấm nút

function shuffleInterval() {
    const elapsed = Date.now() - startTime; // Tính thời gian thực tế đã trôi qua

    if (elapsed < totalDuration) {
        // Chưa đủ 4 giây thì tiếp tục chạy số ngẫu nhiên
        const randomIndex = Math.floor(Math.random() * cells.length);
        labelEl.innerText = "Đang quay lồng cầu...";
        resultEl.innerText = cells[randomIndex];

        // Tự động tính khoảng nghỉ tiếp theo để đến mốc 4 giây là vừa hết bước
        const remainingTime = totalDuration - elapsed;
        const remainingSteps = totalSteps - counter;
        let nextInterval = remainingSteps > 0 ? remainingTime / remainingSteps : 100;

        counter++;
        setTimeout(shuffleInterval, nextInterval);
    } else {
        // ĐÃ ĐÚNG 4 GIÂY -> Chốt kết quả ngay lập tức tại đây!
        const finalIndex = Math.floor(Math.random() * cells.length);
        const finalValue = cells[finalIndex];
        cells.splice(finalIndex, 1);

        labelEl.innerText = "🎉 CHÚC MỪNG CÁC BẠN CÓ SỐ SAU:";
        resultEl.innerText = finalValue;
        boxEl.style.borderColor = '#2ecc71';

        if (sound) {
            sound.pause();
            sound.currentTime = 0;
        }

        document.getElementById('toastNumbers').innerText = finalValue;
        document.getElementById('toastMessage').style.display = 'block';

        const now = new Date().toLocaleTimeString();
        fullHistory.unshift({ time: now, values: finalValue });
        btn.disabled = false;
    }
}

shuffleInterval();
        }

        function closeToast() {
            document.getElementById('toastMessage').style.display = 'none';
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Lỗi khi mở toàn màn hình: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function resetGame() {
            if (confirm("Bạn có chắc chắn muốn làm mới lại danh sách từ đầu không?")) {
                cells = [...originalCells];
                fullHistory = [];
                document.getElementById('toastMessage').style.display = 'none';
                document.getElementById('cellLabel').innerText = "ready";
                document.getElementById('numberResult').innerText = "Let's go!";
                document.getElementById('displayBox').style.borderColor = '#3498db';
                document.getElementById('spinBtn').disabled = false;
            }
        }

        function openHistoryModal() {
            const modal = document.getElementById('historyModal');
            const listContainer = document.getElementById('fullHistoryList');
            
            if (fullHistory.length === 0) {
                listContainer.innerHTML = "Chưa có lượt quay nào được ghi nhận.";
            } else {
                let html = "";
                fullHistory.forEach((item, index) => {
                    html += `<div class="history-item">
                        <span><strong>Lượt ${fullHistory.length - index}:</strong> [${item.values}]</span>
                        <span style="color: #888; font-size: 11px;">${item.time}</span>
                    </div>`;
                });
                listContainer.innerHTML = html;
            }
            modal.style.display = "flex";
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = "none";
        }

        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
