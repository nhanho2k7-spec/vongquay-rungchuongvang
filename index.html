<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"> <!-- Khai báo bảng mã ký tự tiếng Việt UTF-8 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Đảm bảo giao diện tương thích responsive trên mọi thiết bị -->
    <title>Chương trình quay số Rung Chuông Vàng</title> <!-- Tiêu đề hiển thị trên tab trình duyệt -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"> <!-- Tải font chữ Poppins từ Google Fonts -->
    <style>
        /* Thiết lập chung cho toàn bộ trang */
        * {
            box-sizing: border-box; /* Tính toán kích thước bao gồm padding và border */
            margin: 0; /* Xóa lề ngoài mặc định */
            padding: 0; /* Xóa khoảng đệm trong mặc định */
            font-family: 'Poppins', sans-serif; /* Áp dụng font chữ Poppins */
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); /* Nền chuyển sắc gradient hiện đại */
            min-height: 100vh; /* Chiều cao tối thiểu phủ kín màn hình */
            display: flex; /* Sử dụng mô hình Flexbox */
            flex-direction: column; /* Sắp xếp theo chiều dọc */
            align-items: center; /* Căn giữa theo chiều ngang */
            justify-content: center; /* Căn giữa theo chiều dọc */
            padding: 20px; /* Khoảng đệm bao quanh body */
            color: #333; /* Màu chữ mặc định */
        }
        .container {
            background: #ffffff; /* Nền trắng cho hộp chứa nội dung chính */
            padding: 65px 70px; /* Khoảng đệm bên trong hộp chính */
            border-radius: 30px; /* Bo tròn góc hộp */
            box-shadow: 0 15px 40px rgba(0,0,0,0.1); /* Hiệu ứng đổ bóng mờ sang trọng */
            text-align: center; /* Căn giữa toàn bộ chữ */
            max-width: 950px; /* Chiều rộng tối đa */
            width: 100%; /* Co giãn linh hoạt theo màn hình */
        }
        .logos-container {
            display: flex; /* Sắp xếp các logo theo hàng ngang */
            justify-content: center; /* Căn giữa logo theo chiều ngang */
            align-items: center; /* Căn giữa theo chiều dọc */
            gap: 15px; /* Khoảng cách giữa các ô logo */
            margin-bottom: 25px; /* Khoảng cách lề dưới */
        }
        .logo-box {
            width: 75px; /* Chiều rộng ô chứa logo */
            height: 75px; /* Chiều cao ô chứa logo */
            border: none; /* Không viền */
            border-radius: 12px; /* Bo tròn góc khung logo */
            display: flex; /* Căn giữa hình ảnh bên trong */
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Ẩn phần hình ảnh bị tràn ra ngoài */
            background: #ffffff; /* Nền trắng */
            position: relative;
        }
        .logo-box img {
            max-width: 100%; /* Giới hạn chiều rộng ảnh */
            max-height: 100%; /* Giới hạn chiều cao ảnh */
            object-fit: contain; /* Giữ tỉ lệ chuẩn khung hình */
        }
        .logo-box img[src="logo3.jpg"] {
            background: #ffffff;
            padding: 8px;
            object-fit: contain;
            transform: scale(1.32); /* Phóng to logo thứ 3 cho cân đối */
        }
        h1 {
            color: #2c3e50; /* Màu xanh đậm cho tiêu đề chính */
            margin-bottom: 8px; /* Khoảng cách phía dưới tiêu đề */
            font-size: 24px; /* Kích thước chữ tiêu đề chính (có thể thay đổi tùy ý) */
        }
        p.subtitle {
            color: #7f8c8d; /* Màu xám cho phụ đề */
            margin-bottom: 25px; /* Khoảng cách lề dưới */
            font-size: 16px; /* Kích thước chữ phụ đề */
        }
        .display-box {
            background: #f8f9fa; /* Nền xám nhạt khung hiển thị kết quả */
            border: 3px dashed #3498db; /* Viền nét đứt xanh dương nổi bật */
            border-radius: 15px; /* Bo tròn góc khung */
            padding: 25px; /* Khoảng đệm bên trong */
            margin-bottom: 25px; /* Khoảng cách lề dưới */
            min-height: 130px; /* Chiều cao tối thiểu */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease; /* Hiệu ứng chuyển động mượt mà */
        }
        .cell-label {
            font-size: 14px; /* Kích thước chữ nhãn trạng thái */
            color: #e74c3c; /* Màu đỏ nổi bật cho nhãn */
            font-weight: 600; /* Độ đậm chữ */
            text-transform: uppercase; /* Viết hoa toàn bộ chữ cái */
            letter-spacing: 1px; /* Khoảng cách giãn chữ */
            margin-bottom: 8px; /* Khoảng cách dưới nhãn */
        }
        .numbers-result {
            font-size: 30px; /* Kích thước chữ số kết quả rất lớn */
            font-weight: 700; /* Độ đậm chữ số tối đa */
            color: #2c3e50; /* Màu xanh đậm cho kết quả */
            letter-spacing: 1px; /* Giãn khoảng cách các ký tự số */
        }
        .button-group {
            display: flex; /* Sắp xếp các nút hàng ngang */
            gap: 15px; /* Khoảng cách giữa các nút bấm */
            justify-content: center; /* Căn giữa các nút */
            margin-top: 15px;
            flex-wrap: wrap; /* Tự động xuống dòng nếu màn hình hẹp */
        }
        .btn-spin {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); /* Nền nút quay màu đỏ */
            color: white; /* Chữ trắng */
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px; /* Bo tròn dạng viên thuốc */
            cursor: pointer; /* Con trỏ chuột hình bàn tay */
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4); /* Đổ bóng màu đỏ mờ */
            transition: transform 0.1s;
        }
        .btn-spin:active {
            transform: scale(0.95); /* Hiệu ứng thu nhỏ khi nhấn nút */
        }
        .btn-spin:disabled {
            background: #bdc3c7; /* Đổi sang màu xám khi nút bị vô hiệu hóa */
            cursor: not-allowed; /* Con trỏ cấm bấm */
            box-shadow: none;
        }
        .btn-history {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); /* Nền nút lịch sử màu xanh dương */
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .btn-reset {
            background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); /* Nền nút reset màu cam */
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.4);
        }
        .toast-banner {
            background: #eef2f7; /* Nền xám nhạt cho banner thông báo nhanh */
            border: 2px dashed #2ecc71; /* Viền nét đứt xanh lá cây */
            padding: 18px 25px;
            border-radius: 15px;
            margin: 15px auto;
            width: 100%;
            animation: fadeInDown 0.3s ease-in-out; /* Hiệu ứng trượt xuống */
            display: none; /* Mặc định ẩn banner */
        }
        .toast-content {
            display: flex;
            justify-content: space-between; /* Căn đều nội dung sang hai bên */
            align-items: center;
            color: #2c3e50;
            font-size: 23px;
        }
        .toast-content b {
            color: #e74c3c; /* Tô màu đỏ cho số quan trọng trong banner */
        }
        .toast-close-btn {
            background: none;
            border: none;
            font-size: 22px;
            font-weight: bold;
            color: #7f8c8d;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
        }
        .toast-close-btn:hover {
            color: #e74c3c;
        }
        .top-controls {
            position: fixed; /* Cố định vị trí các nút phụ ở góc màn hình */
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000; /* Nằm lớp trên cùng */
        }
        .top-btn {
            background: rgba(0, 0, 0, 0.7); /* Nền đen mờ trong suốt */
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .top-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        .modal {
            display: none; /* Mặc định ẩn các bảng popup modal */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6); /* Lớp phủ nền tối mờ */
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff; /* Nền trắng cho hộp nội dung modal */
            padding: 30px !important;
            border-radius: 20px;
            width: 90vw !important; /* Mở rộng chiều rộng modal để chứa cả đồng hồ và QR */
            max-width: 1200px !important; /* Kích thước tối đa rộng hơn để hiển thị đẹp mắt */
            box-shadow: 0 15px 50px rgba(0,0,0,0.4);
            text-align: center;
        }
        /* CSS chia bố cục bên trong modal đếm ngược: Trái là đồng hồ, Phải là QR Code lớn */
        .countdown-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            margin: 20px 0;
        }
        .countdown-left-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .countdown-right-side {
            flex: 1; /* Chiếm diện tích lớn bên phải (tương đương gần một nửa màn hình) */
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 2px dashed #eee; /* Đường kẻ phân cách nhẹ */
            padding-left: 20px;
        }
        .modal-qr-image {
            width: 100%;
            max-width: 500px; /* Kích thước QR Code to rõ */
            height: auto;
            object-fit: contain;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .modal-header h2 {
            font-size: 28px !important;
            margin: 0;
            color: #2c3e50;
        }
        .close-btn {
            background: none;
            border: none;
            font-size: 30px;
            cursor: pointer;
            color: #7f8c8d;
        }
        .close-btn:hover {
            color: #e74c3c;
        }
        #countdownDisplay {
            font-size: 110px !important; /* Cỡ chữ số đồng hồ đếm ngược lớn */
            font-weight: bold;
            color: #e74c3c;
            margin: 20px 0;
            letter-spacing: 5px;
        }
        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid #f1f2f6;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            text-align: left;
        }
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Khối nút bấm chức năng ở góc phải phía trên màn hình -->
    <div class="top-controls">
        <button onclick="openCountdownModal()" class="top-btn" title="Đồng hồ đếm ngược 5 phút">⏱️</button> <!-- Nút mở bảng đếm ngược -->
        <button id="musicToggleBtn" onclick="toggleBgMusic()" class="top-btn" title="Bật/Tắt nhạc nền">🔇</button> <!-- Nút bật tắt nhạc nền -->
        <button onclick="toggleFullScreen()" class="top-btn" title="Phóng to toàn màn hình">⛶</button> <!-- Nút phóng to toàn màn hình -->
    </div>

    <!-- Các thẻ âm thanh (audio) dùng cho hiệu ứng -->
    <audio id="bgMusic" src="nhacnen.mp3" preload="auto" loop></audio> <!-- Thẻ chứa file nhạc nền lặp lại -->
    <audio id="spinAudio" src="nhacquay.mp3" preload="auto" style="display:none;"></audio> <!-- Thẻ chứa file âm thanh quay số -->

    <div class="container">
        <!-- Khu vực hiển thị 3 logo đơn vị -->
        <div class="logos-container">
            <div class="logo-box">
                <img src="logo1.jpg" alt="Logo 1" onerror="this.style.display='none'"> <!-- Ô chứa logo đơn vị thứ nhất -->
            </div>
            <div class="logo-box">
                <img src="logo2.jpg" alt="Logo 2" onerror="this.style.display='none'"> <!-- Ô chứa logo đơn vị thứ hai -->
            </div>
            <div class="logo-box">
                <img src="logo3.jpg" alt="Logo 3" onerror="this.style.display='none'"> <!-- Ô chứa logo đơn vị thứ ba -->
            </div>
        </div>

        <h1>Truy Tìm 15 Chiến Binh Rung Chuông Vàng</h1> <!-- Tiêu đề chính lớn của chương trình -->
        <p class="subtitle">Vòng quay định mệnh – Lộ diện 15 gương mặt may mắn nhất</p> <!-- Phụ đề mô tả chương trình -->

        <!-- Banner thông báo kết quả quay nhanh -->
        <div id="toastMessage" class="toast-banner">
            <div class="toast-content">
                <span>🎉 <b>Kết quả:</b> <span id="toastNumbers">00, 00, 00, 00, 00</span></span> <!-- Hiển thị chuỗi số trúng giải -->
                <button onclick="closeToast()" class="toast-close-btn">&times;</button> <!-- Nút đóng banner thông báo nhanh -->
            </div>
        </div>

        <!-- Khung chính hiển thị số hoặc trạng thái vòng quay -->
        <div class="display-box" id="displayBox">
            <div class="cell-label" id="cellLabel">ready</div> <!-- Nhãn trạng thái nhỏ (Ready, Đang quay...) -->
            <div class="numbers-result" id="numberResult">Let's go!</div> <!-- Nội dung số lớn hiển thị trung tâm màn hình -->
        </div>

        <!-- Nhóm các nút điều khiển chính -->
        <div class="button-group">
            <button class="btn-spin" id="spinBtn" onclick="startSpinning()">Bắt đầu</button> <!-- Nút bắt đầu quay số -->
            <button class="btn-history" onclick="openHistoryModal()">Lịch sử</button> <!-- Nút mở bảng lịch sử các lượt quay -->
            <button class="btn-reset" onclick="resetGame()">Làm mới</button> <!-- Nút khôi phục vòng quay từ đầu -->
        </div>
    </div>

    <!-- Hộp thoại Modal Lịch sử các lượt quay -->
    <div class="modal" id="historyModal">
        <div class="modal-content" style="max-width: 650px !important;">
            <div class="modal-header">
                <h2>Lịch Sử Đã Quay</h2> <!-- Tiêu đề bảng lịch sử -->
                <button class="close-btn" onclick="closeHistoryModal()">&times;</button> <!-- Nút đóng bảng lịch sử -->
            </div>
            <div id="fullHistoryList" style="max-height: 40vh; overflow-y: auto;">Chưa có lượt quay nào.</div> <!-- Danh sách lịch sử có thanh cuộn -->
        </div>
    </div>

    <!-- Hộp thoại Modal Đồng hồ đếm ngược 5 phút (Tích hợp QR Code lớn bên phải) -->
    <div class="modal" id="countdownModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⏱️Thời gian đếm ngược còn:</h2> <!-- Tiêu đề bảng đếm ngược -->
                <button class="close-btn" onclick="closeCountdownModal()">&times;</button> <!-- Nút đóng bảng đếm ngược -->
            </div>
            
            <!-- Bố cục chia đôi: Trái là đồng hồ, Phải là QR Code -->
            <div class="countdown-layout">
                <div class="countdown-left-side">
                    <div id="countdownDisplay">
                        05:00 <!-- Màn hình hiển thị số phút:giây đếm ngược -->
                    </div>
                    <div class="button-group" style="display: flex; justify-content: center; gap: 15px; margin-top: 10px;">
                        <button class="top-btn" style="background: #2ecc71; font-size: 16px !important; padding: 10px 20px !important; border-radius: 12px; cursor: pointer;" onclick="startCountdown()">Bắt đầu</button> <!-- Nút bắt đầu đồng hồ -->
                        <button class="top-btn" style="background: #e67e22; font-size: 16px !important; padding: 10px 20px !important; border-radius: 12px; cursor: pointer;" onclick="pauseCountdown()">Tạm dừng</button> <!-- Nút tạm dừng đồng hồ -->
                        <button class="top-btn" style="background: #e74c3c; font-size: 16px !important; padding: 10px 20px !important; border-radius: 12px; cursor: pointer;" onclick="resetCountdown()">Đặt lại</button> <!-- Nút cài đặt lại thời gian ban đầu -->
                    </div>
                </div>
                
                <div class="countdown-right-side">
                    <!-- Thẻ hình ảnh QR Code tích hợp hàm kiểm tra if/else định dạng ảnh png/jpg -->
                    <img id="qrImageElement" src="qrcode.jpg" alt="Mã QR Code" class="modal-qr-image" style="display: none;" onerror="handleQrError(this)">
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- HÀM XỬ LÝ IF/ELSE ĐỊNH DẠNG ẢNH QR (PNG HOẶC JPG) ---
        function handleQrError(imgElement) {
            // Kiểm tra nếu file hiện tại là qrcode.png bị lỗi/không tồn tại
            if (imgElement.src.includes("qrcode.png")) {
                imgElement.src = "qrcode.jpg"; // Chuyển sang thử tìm file qrcode.jpg
            } else {
                // Nếu cả png và jpg đều không tìm thấy thì hiển thị ảnh thông báo
                imgElement.src = 'https://via.placeholder.com/400?text=Vui+long+them+file+qrcode.png+hoac+jpg'; 
            }
        }

        // --- XỬ LÝ NHẠC NỀN ---
        function toggleBgMusic() {
            const bgMusic = document.getElementById('bgMusic'); // Lấy tham chiếu đến thẻ audio nhạc nền
            const musicBtn = document.getElementById('musicToggleBtn'); // Lấy tham chiếu đến nút bấm bật/tắt nhạc

            if (bgMusic.paused) { // Kiểm tra nếu nhạc đang ở trạng thái dừng
                bgMusic.volume = 0.4; // Đặt mức âm lượng phát ở mức vừa phải (40%)
                bgMusic.play().then(() => { // Kích hoạt phát nhạc nền
                    musicBtn.innerText = "🔊"; // Đổi biểu tượng thành loa đang bật
                }).catch(e => {
                    alert("Không thể phát file nhạc nền. Bạn hãy kiểm tra lại file 'nhacnen.mp3' có nằm chung thư mục không nhé!"); // Báo lỗi nếu thiếu file
                });
            } else {
                bgMusic.pause(); // Dừng phát nhạc nền nếu đang chạy
                musicBtn.innerText = "🔇"; // Đổi biểu tượng thành loa đang tắt
            }
        }

        // --- DỮ LIỆU QUAY SỐ ---
        const originalCells = [ // Mảng lưu trữ danh sách các nhóm số dự thi ban đầu
            "145, 12, 384, 95, 230", "67, 211, 342, 3, 188", "255, 48, 112, 399, 74", "18, 301, 133, 264, 89",
            "315, 150, 41, 222, 59", "102, 360, 27, 175, 288", "333, 8, 194, 120, 246", "77, 305, 161, 29, 370",
            "235, 114, 52, 348, 180", "15, 272, 390, 91, 205", "320, 64, 137, 250, 2", "190, 31, 280, 110, 354",
            "84, 219, 365, 45, 168", "295, 13, 228, 98, 330", "380, 56, 172, 241, 105", "23, 311, 142, 275, 70",
            "118, 350, 5, 185, 292", "362, 80, 215, 38, 325", "200, 155, 62, 268, 127", "40, 338, 94, 283, 170",
            "312, 11, 248, 79, 192", "165, 375, 54, 220, 130", "285, 88, 3, 303, 210", "35, 125, 262, 392, 178",
            "225, 90, 140, 340, 65", "100, 318, 20, 258, 182", "352, 50, 174, 290, 82", "148, 270, 75, 368, 15",
            "240, 85, 322, 116, 202", "308, 33, 160, 232, 385", "60, 198, 345, 122, 278", "183, 395, 25, 96, 316",
            "328, 10, 212, 152, 260", "72, 252, 378, 135, 44", "208, 364, 99, 30, 298", "115, 335, 55, 186, 245",
            "294, 62, 162, 382, 18", "372, 138, 274, 86, 224", "49, 196, 310, 108, 265", "158, 358, 25, 324, 76",
            "226, 81, 390, 144, 203", "92, 314, 17, 282, 132", "346, 58, 238, 101, 276", "128, 284, 4, 355, 189",

        let cells = [...originalCells]; // Tạo bản sao dữ liệu dùng để quay (bị bớt dần sau mỗi lần trúng)
        let fullHistory = []; // Mảng lưu trữ lịch sử các lượt quay thành công

        // --- LOGIC QUAY SỐ ---
        function startSpinning() {
            const spinBtn = document.getElementById('spinBtn'); // Lấy nút bắt đầu quay
            if (spinBtn.disabled) return; // Nếu đang quay thì không bấm tiếp

            if (cells.length === 0) { // Kiểm tra nếu đã quay hết toàn bộ danh sách
                alert("Đã quay hết tất cả các nhóm! Vui lòng bấm nút 'Làm mới (Reset)'."); // Cảnh báo khi hết dữ liệu
                return;
            }

            const sound = document.getElementById('spinAudio'); // Lấy thẻ audio hiệu ứng âm thanh quay số
            if (sound) {
                sound.currentTime = 0; // Đưa thời gian phát âm thanh về mốc bắt đầu (0s)
                sound.play().catch(e => console.log("Lỗi phát nhạc quay:", e)); // Phát âm thanh quay
            }

            const btn = document.getElementById('spinBtn'); // Lấy nút bấm "Bắt đầu quay"
            const resultEl = document.getElementById('numberResult'); // Lấy ô hiển thị số kết quả lớn
            const labelEl = document.getElementById('cellLabel'); // Lấy nhãn trạng thái trên ô kết quả
            const boxEl = document.getElementById('displayBox'); // Lấy khung bao bọc ô kết quả
            
            btn.disabled = true; // Vô hiệu hóa nút quay để tránh bấm liên tục khi đang chạy
            boxEl.style.borderColor = '#e74c3c'; // Đổi màu viền khung thành màu đỏ khi đang quay
            
            let counter = 0; // Biến đếm số bước nhảy trong hiệu ứng quay
            const totalSteps = 25; // Tổng số lần thay đổi số ngẫu nhiên trước khi dừng hẳn
            const totalDuration = 4000; // Tổng thời gian diễn ra một lượt quay (4000 mili-giây = 4 giây)
            const startTime = Date.now(); // Ghi nhận thời điểm bắt đầu quay chính xác bằng mili-giây

            function shuffleInterval() {
                const elapsed = Date.now() - startTime; // Tính thời gian thực tế đã trôi qua kể từ khi bấm quay

                if (elapsed < totalDuration) { // Kiểm tra nếu chưa hết thời gian quay (4 giây)
                    const randomIndex = Math.floor(Math.random() * cells.length); // Lấy một vị trí chỉ số ngẫu nhiên từ mảng dữ liệu còn lại
                    labelEl.innerText = "Đang quay..."; // Cập nhật nhãn trạng thái đang quay
                    resultEl.innerText = cells[randomIndex]; // Hiển thị tạm thời số ngẫu nhiên lên màn hình

                    const remainingTime = totalDuration - elapsed; // Tính thời gian còn lại
                    const remainingSteps = totalSteps - counter; // Tính số bước nhảy còn lại
                    let nextInterval = remainingSteps > 0 ? remainingTime / remainingSteps : 100; // Tăng dần khoảng thời gian giữa các bước để tạo hiệu ứng chậm dần đều

                    counter++; // Tăng biến đếm bước lên 1 đơn vị
                    setTimeout(shuffleInterval, nextInterval); // Lên lịch chạy tiếp bước hiệu ứng tiếp theo
                } else { // Khi đã hết thời gian quay (đến mốc dừng lại)
                    const finalIndex = Math.floor(Math.random() * cells.length); // Chọn ngẫu nhiên phần tử kết quả cuối cùng
                    const finalValue = cells[finalIndex]; // Lấy giá trị chuỗi số trúng giải
                    cells.splice(finalIndex, 1); // Loại bỏ phần tử vừa trúng ra khỏi mảng để không bị quay lại ở các lượt sau

                    labelEl.innerText = "🎉 CHÚC MỪNG CÁC BẠN CÓ SỐ SAU:"; // Cập nhật nhãn trạng thái chúc mừng
                    resultEl.innerText = finalValue; // Hiển thị kết quả chính thức lên màn hình
                    boxEl.style.borderColor = '#2ecc71'; // Đổi màu viền khung thành màu xanh lá cây báo hiệu thành công

                    if (sound) {
                        sound.pause(); // Dừng phát âm thanh hiệu ứng quay số
                        sound.currentTime = 0; // Đưa âm thanh về mốc đầu
                    }

                    document.getElementById('toastNumbers').innerText = finalValue; // Đưa kết quả vào banner thông báo nhanh
                    document.getElementById('toastMessage').style.display = 'block'; // Hiển thị banner thông báo nhanh lên màn hình

                    const now = new Date().toLocaleTimeString(); // Lấy thời gian hệ thống hiện tại định dạng giờ:phút:giây
                    fullHistory.unshift({ time: now, values: finalValue }); // Lưu thông tin lượt quay vào đầu mảng lịch sử
                    btn.disabled = false; // Mở khóa lại nút "Bắt đầu quay" cho lượt tiếp theo
                }
            }

            shuffleInterval(); // Kích hoạt chạy vòng lặp hiệu ứng quay số ngẫu nhiên
        }

        // --- ĐÓNG BANNER THÔNG BÁO ---
        function closeToast() {
            document.getElementById('toastMessage').style.display = 'none'; // Ẩn banner thông báo kết quả nhanh khi bấm nút đóng
        }

        // --- BẬT/TẮT TOÀN MÀN HÌNH ---
        function toggleFullScreen() {
            if (!document.fullscreenElement) { // Kiểm tra nếu trình duyệt chưa ở chế độ toàn màn hình
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Lỗi khi mở toàn màn hình: ${err.message}`); // Báo lỗi nếu không thể phóng to toàn màn hình
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen(); // Thoát khỏi chế độ toàn màn hình nếu đang bật
                }
            }
        }

        // --- LÀM MỚI (RESET) TRÒ CHƠI ---
        function resetGame() {
            if (confirm("Bạn có chắc chắn muốn làm mới lại danh sách từ đầu không?")) { // Hộp thoại xác nhận trước khi reset
                cells = [...originalCells]; // Khôi phục lại toàn bộ danh sách dữ liệu ban đầu
                fullHistory = []; // Xóa sạch mảng lưu lịch sử quay
                document.getElementById('toastMessage').style.display = 'none'; // Ẩn banner thông báo nhanh
                document.getElementById('cellLabel').innerText = "ready"; // Đặt lại nhãn trạng thái ban đầu
                document.getElementById('numberResult').innerText = "Let's go!"; // Đặt lại nội dung màn hình chính ban đầu
                document.getElementById('displayBox').style.borderColor = '#3498db'; // Khôi phục màu viền xanh dương ban đầu
                document.getElementById('spinBtn').disabled = false; // Kích hoạt lại nút quay
            }
        }

        // --- QUẢN LÝ MODAL LỊCH SỬ ---
        function openHistoryModal() {
            const modal = document.getElementById('historyModal'); // Lấy tham chiếu đến khung modal lịch sử
            const listContainer = document.getElementById('fullHistoryList'); // Lấy vùng chứa danh sách lịch sử bên trong modal
            
            if (fullHistory.length === 0) { // Kiểm tra nếu chưa có lượt quay nào được thực hiện
                listContainer.innerHTML = "Chưa có lượt quay nào được ghi nhận."; // Hiển thị thông báo trống
            } else {
                let html = ""; // Khởi tạo biến chuỗi HTML chứa danh sách lịch sử
                fullHistory.forEach((item, index) => { // Duyệt qua từng phần tử trong mảng lịch sử
                    html += `<div class="history-item">
                        <span><strong>Lượt ${fullHistory.length - index}:</strong> [${item.values}]</span> <!-- Hiển thị số thứ tự lượt quay và giá trị kết quả -->
                        <span style="color: #888; font-size: 12px;">${item.time}</span> <!-- Hiển thị thời gian thực hiện lượt quay -->
                    </div>`;
                });
                listContainer.innerHTML = html; // Đưa toàn bộ danh sách HTML vào trong modal lịch sử
            }
            modal.style.display = "flex"; // Hiển thị modal lịch sử lên màn hình bằng kiểu flex
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').style.display = "none"; // Ẩn modal lịch sử đi
        }

        // --- QUẢN LÝ ĐỒNG HỒ ĐẾM NGƯỢC 5 PHÚT ---
        // --- QUẢN LÝ ĐỒNG HỒ ĐẾM NGƯỢC 5 PHÚT ---
let countdownInterval; 
let timeLeft = 300; 

function openCountdownModal() {
    document.getElementById('countdownModal').style.display = "flex"; 
    // Mở bảng lên thì ẩn QR đi trước, chờ khi nào bấm Bắt đầu mới hiện
    document.getElementById('qrImageElement').style.display = "none";
}

function closeCountdownModal() {
    document.getElementById('countdownModal').style.display = "none"; 
    pauseCountdown(); 
}

function updateCountdownDisplay() {
    const minutes = Math.floor(timeLeft / 60); 
    const seconds = timeLeft % 60; 
    document.getElementById('countdownDisplay').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`; 
}

function startCountdown() {
    if (countdownInterval) return; 
    if (timeLeft <= 0) timeLeft = 300; 
    
    // --- KHI BẤM BẮT ĐẦU THÌ HIỆN QR CODE LÊN ---
    document.getElementById('qrImageElement').style.display = "block";

    countdownInterval = setInterval(() => { 
        if (timeLeft > 0) {
            timeLeft--; 
            updateCountdownDisplay(); 
        } else {
            clearInterval(countdownInterval); 
            countdownInterval = null;
            alert("⏰ Hết giờ!"); 
        }
    }, 1000);
}

function pauseCountdown() {
    clearInterval(countdownInterval); 
    countdownInterval = null;
    // --- KHI TẠM DỪNG: KHÔNG ĐỤNG TỚI QR NÊN NÓ SẼ GIỮ NGUYÊN KHÔNG BỊ MẤT ---
}

function resetCountdown() {
    clearInterval(countdownInterval); 
    countdownInterval = null;
    timeLeft = 300; 
    updateCountdownDisplay(); 
    
    // --- KHI ĐẶT LẠI THÌ ẨN QR CODE ĐI ---
    document.getElementById('qrImageElement').style.display = "none";
}

        // --- XỬ LÝ PHÍM TẮT BÀN PHÍM ---
        document.addEventListener('keydown', function(event) {
            const modal = document.getElementById('countdownModal'); // Lấy modal đếm ngược
            const historyModal = document.getElementById('historyModal'); // Lấy modal lịch sử
            
            // 1. Nhấn phím F để Bật/Tắt chế độ toàn màn hình
            if (event.code === "KeyF" || event.key === "f" || event.key === "F") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
                return;
            }

            // 2. Nhấn phím T để Mở/Đóng bảng đếm ngược
            if (event.code === "KeyT" || event.key === "t" || event.key === "T") {
                event.preventDefault();
                if (modal.style.display === "flex") {
                    closeCountdownModal();
                } else {
                    openCountdownModal();
                }
                return;
            }

            // 3. Nhấn phím H để Mở/Đóng bảng Lịch sử
            if (event.code === "KeyH" || event.key === "h" || event.key === "H") {
                event.preventDefault();
                if (historyModal.style.display === "flex") {
                    closeHistoryModal();
                } else {
                    openHistoryModal();
                }
                return;
            }

            // 4. Nhấn phím L để Làm mới (Reset) game
            if (event.code === "KeyL" || event.key === "l" || event.key === "L") {
                event.preventDefault();
                resetGame();
                return;
            }

            // 5. Nhấn phím Backspace hoặc X để đóng nhanh các hộp thoại popup đang mở
            if (event.code === "Backspace" || event.code === "KeyX" || event.key === "x" || event.key === "X") {
                if (modal && modal.style.display === "flex") {
                    event.preventDefault();
                    closeCountdownModal();
                }
                if (historyModal && historyModal.style.display === "flex") {
                    event.preventDefault();
                    closeHistoryModal();
                }
                return;
            }

            // 6. Xử lý riêng trong bảng đếm ngược (Space/Enter để Bắt đầu/Tạm dừng, R để Đặt lại)
            if (modal && modal.style.display === "flex") {
                if (event.code === "Space" || event.code === "Enter") {
                    event.preventDefault();
                    if (countdownInterval) {
                        pauseCountdown();
                    } else {
                        startCountdown();
                    }
                } else if (event.code === "KeyR" || event.key === "r" || event.key === "R") {
                    resetCountdown();
                }
                return;
            }

            // 7. Ở màn hình chính: Nhấn Space hoặc Enter để Bắt đầu quay số
            if (event.code === "Space" || event.code === "Enter") {
                event.preventDefault();
                startSpinning();
            }
        });

        // Click vào vùng nền tối mờ bên ngoài để tự động đóng popup
        window.onclick = function(event) {
            const historyModal = document.getElementById('historyModal');
            const countdownModal = document.getElementByIffd('countdownModal');
            if (event.target == historyModal) {
                historyModal.style.display = "none";
            }
            if (event.target == countdownModal) {
                countdownModal.style.display = "none";
                pauseCountdown();
            }
        }
    </script>
